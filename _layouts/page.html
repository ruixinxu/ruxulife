<!DOCTYPE html>
<html data-lang="zh">
<head>
{% include head.html %}
</head>
<body data-page-title-zh="{{ page.title | escape }}" data-page-title-en="{{ page.title_en | default: page.title | escape }}" data-page-description-zh="{{ page.description | default: site.description | strip_html | escape }}" data-page-description-en="{{ page.description_en | default: page.description | default: site.description | strip_html | escape }}">
{% include header.html %}

<div class="page-content">
  <div class="wrap">
    <article class="post">
      <header class="post-header">
        <h1>{{ page.title }}</h1>
      </header>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </div>
</div>

{% include footer.html %}
{% include scripts.html %}
</body>
</html>
