<div class="post-share">
    <p>
        <span class="lang-zh">分享这篇文章：</span>
        <span class="lang-en">Share this post:</span>
    </p>
    <ul>
        <li><a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ site.baseurl }}{{ page.url }}" onclick="window.open(this.href, 'facebook-share','width=580,height=296');return false;">Facebook</a></li>
        {% if site.owner.twitter %}<li><a href="https://twitter.com/intent/tweet?text=&quot;{{ page.title }}&quot;%20{{ site.url }}{{ site.baseurl }}{{ page.url }}%20via%20&#64;{{ site.owner.twitter }}" onclick="window.open(this.href, 'twitter-share', 'width=550,height=235');return false;">Twitter</a></li>{% endif %}
    </ul>
</div>
