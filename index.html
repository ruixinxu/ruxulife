---
layout: home
title: 如许读书
description: "问渠哪得清如许 唯有源头活水来"
---
<div class="home">
  <ul class="posts">
    {% for post in site.posts %}
      <li>
        <span class="post-date">{{ post.date | date: "%Y年%m月%d日" }}</span>
        <a class="post-link" href="{{ site.url }}{{ post.url }}">{{ post.title }}</a>
        {% if post.description %}
        <br>
        {{ post.description }}
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</div>
